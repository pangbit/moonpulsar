name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MOONBIT_INSTALL_VERSION: "0.10.18+6c83a7f62"

jobs:
  native-dependencies:
    name: Linux native dependency matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon update
      - name: Verify supported MoonBit toolchain
        run: moon run --deny-warn -j 1 scripts/check-supported-sdk.mbtx
      - name: Verify ZIP in isolated build and runtime environments
        run: moon run scripts/verify-native-deps.mbtx -- --report-dir /tmp/moonpulsar-native-matrix
      - name: Preserve matrix evidence and candidate archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-dependency-matrix
          path: |
            /tmp/moonpulsar-native-matrix/
            _build/publish/*.zip

  openssl-abi:
    name: OpenSSL ABI (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install ABI reference headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev zlib1g-dev
      - name: Update MoonBit dependencies
        run: moon update
      - name: Verify supported MoonBit toolchain
        run: moon run --deny-warn -j 1 scripts/check-supported-sdk.mbtx
      - name: Compare ABI and test loader failures
        run: moon run scripts/verify-native-abi.mbtx -- --report-dir /tmp/moonpulsar-abi
      - name: Verify native zlib boundaries with sanitizers
        run: moon run scripts/verify-zlib-boundary.mbtx
      - name: Test Zlib archive selection
        run: moon test --deny-warn -j 1 scripts/verify-zlib-replacement.mbtx
      - name: Verify pure Zlib differential and performance gate
        env:
          MOONPULSAR_ZLIB_REPORT: /tmp/moonpulsar-zlib-gate
        run: moon run scripts/verify-zlib-replacement.mbtx
      - name: Preserve ABI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openssl-abi-linux
          path: |
            /tmp/moonpulsar-abi/*.log
            /tmp/moonpulsar-zlib-gate/*.log

  broker-regression:
    name: broker regression (${{ matrix.pulsar }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pulsar: ["4.2.4", "3.3.9"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update MoonBit dependencies
        run: moon update
      - name: Verify supported MoonBit toolchain
        run: moon run --deny-warn -j 1 scripts/check-supported-sdk.mbtx

      - uses: actions/setup-go@v5
        with:
          go-version-file: interop/go/go.mod
          cache-dependency-path: interop/go/go.sum

      - name: Verify TLS and encrypted Go/Java interoperability
        run: moon run scripts/verify-native-interop.mbtx -- --pulsar-version "${{ matrix.pulsar }}" --report-dir /tmp/moonpulsar-native-interop

      - name: Verify Go and Java compressed chunks
        shell: bash
        run: bash scripts/test-chunk-interop-live.sh "${{ matrix.pulsar }}" 2>&1 | tee broker-interop-chunk.log

      - name: Verify chunk and receive-queue memory behavior
        shell: bash
        run: bash scripts/test-chunk-live.sh "${{ matrix.pulsar }}" 2>&1 | tee broker-chunk.log

      - name: Verify Consumer and Reader timestamp seek
        shell: bash
        run: bash scripts/test-time-seek-live.sh "${{ matrix.pulsar }}" 2>&1 | tee broker-seek.log

      - name: Upload broker verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broker-logs-${{ matrix.pulsar }}
          path: |
            broker-*.log
            /tmp/moonpulsar-native-interop/*.log
          if-no-files-found: ignore

  test:
    name: native library checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update MoonBit dependencies
        run: |
          moon version --all
          moon update
      - name: Verify supported MoonBit toolchain
        run: moon run --deny-warn -j 1 scripts/check-supported-sdk.mbtx

      - name: Check library and examples
        run: moon check --target native

      - name: Record runner OpenSSL version
        run: |
          openssl version -a
          dpkg-query --show libssl3t64
          sha256sum /usr/lib/x86_64-linux-gnu/libssl.so.3

      - name: Run native tests
        env:
          MOONPULSAR_CONNECTION_DIAGNOSTICS: "1"
        run: |
          # Bound compiler stack for the large whitebox IR; tests keep the runner default.
          prlimit --stack=33554432:33554432 -- moon test --target native --build-only
          moon test --target native

      - name: Run release tests
        run: |
          prlimit --stack=33554432:33554432 -- moon test --release --target native --build-only
          moon test --release --target native

      - name: Build performance benchmarks
        run: moon bench --release --target native --build-only -p pangbit/moonpulsar -f performance_wbtest.mbt

      - name: Check formatting
        run: |
          moon fmt --check
          moon fmt scripts/check-doc-links.mbtx --check

      - name: Check generated interfaces
        run: |
          moon info
          git diff --exit-code

      - name: Generate documentation
        run: moon doc

      - name: Create release archive
        run: moon package --list

      - name: Check package and public documentation links
        run: moon run scripts/check-doc-links.mbtx -- --public --archive _build/publish/pangbit-moonpulsar-0.1.3.zip

      - name: Verify published OpenSSL boundary (partial native-dependency scope)
        run: moon run scripts/verify-native-deps.mbtx -- --openssl-only --report-dir /tmp/moonpulsar-openssl-deps

      - name: Preserve external package diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openssl-package-checks
          path: /tmp/moonpulsar-openssl-deps/
          if-no-files-found: ignore
