name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openssl-abi:
    name: OpenSSL ABI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v5
      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install ABI reference headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Install ABI reference headers (macOS)
        if: runner.os == 'macOS'
        run: brew install openssl@3
      - name: Compare ABI and test loader failures
        run: moon run scripts/verify-native-abi.mbtx -- --report-dir /tmp/moonpulsar-abi
      - name: Preserve ABI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openssl-abi-${{ matrix.os }}
          path: /tmp/moonpulsar-abi/*.log

  broker-regression:
    name: broker regression (${{ matrix.pulsar }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pulsar: ["4.2.4", "3.3.9"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update MoonBit dependencies
        run: moon update

      - name: Verify chunk and receive-queue memory behavior
        shell: bash
        run: bash scripts/test-chunk-live.sh "${{ matrix.pulsar }}" 2>&1 | tee broker-chunk.log

      - name: Verify Consumer and Reader timestamp seek
        shell: bash
        run: bash scripts/test-time-seek-live.sh "${{ matrix.pulsar }}" 2>&1 | tee broker-seek.log

      - name: Upload broker failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: broker-logs-${{ matrix.pulsar }}
          path: broker-*.log
          if-no-files-found: ignore

  test:
    name: native library checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Update MoonBit dependencies
        run: |
          moon version --all
          moon update

      - name: Check library and examples
        run: moon check --target native

      - name: Run native tests
        run: moon test --target native

      - name: Run release tests
        run: moon test --release --target native

      - name: Build performance benchmarks
        run: moon bench --release --target native --build-only -p pangbit/moonpulsar -f performance_wbtest.mbt

      - name: Check formatting
        run: moon fmt --check

      - name: Check generated interfaces
        run: |
          moon info
          git diff --exit-code

      - name: Generate documentation
        run: moon doc

      - name: Create release archive
        run: moon package --list

      - name: Verify published OpenSSL boundary (partial native-dependency scope)
        run: moon run scripts/verify-native-deps.mbtx -- --openssl-only --report-dir /tmp/moonpulsar-openssl-deps

      - name: Preserve external package diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openssl-package-checks
          path: /tmp/moonpulsar-openssl-deps/
          if-no-files-found: ignore
