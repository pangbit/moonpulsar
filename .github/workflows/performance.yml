name: Performance baselines

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  microbenchmarks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon update
      - name: Record environment
        run: |
          moon version --all > performance-environment.log
          git rev-parse HEAD >> performance-environment.log
          uname -a >> performance-environment.log
          lscpu >> performance-environment.log
      - name: Run microbenchmarks
        shell: bash
        run: moon bench --release --target native -p pangbit/moonpulsar -f performance_wbtest.mbt > performance-bench.log 2>&1
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-${{ github.sha }}
          path: performance-*.log
